version: "3.9"

services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.8.0
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    restart: unless-stopped

  producer:
    build: ./kafka_producer
    container_name: producer
    env_file: .env
    depends_on:
      - kafka
    restart: unless-stopped

  consumer_for_azure:
    build: ./kafka_consumer_for_azure
    container_name: kafka_consumer_for_azure
    env_file: .env
    depends_on:
      - kafka
    restart: unless-stopped

  consumer_for_postgres:
    build: ./kafka_consumer_for_postgres
    container_name: kafka_consumer_for_postgres
    env_file: .env
    depends_on:
      - kafka
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: kafka_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kafka_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    depends_on:
      - postgres
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.9.2
    container_name: airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://kafka_user:${POSTGRES_PASSWORD}@postgres:5432/kafka_data
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__METRICS__STATSD_ON=True
      - AIRFLOW__METRICS__STATSD_HOST=airflow-statsd
      - AIRFLOW__METRICS__STATSD_PORT=9125
      - AIRFLOW__METRICS__STATSD_PREFIX=airflow
      - AIRFLOW__METRICS__STATSD_ALLOW_LIST=*
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-postgres apache-airflow-providers-snowflake
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: >
      bash -c "
      chown -R airflow: /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins &&
      airflow db init &&
      airflow users create --username admin --password admin --firstname admin --lastname user --role Admin --email 711laskowski@gmail.com &&
      airflow webserver -p 8080 & 
      airflow scheduler
      "
    depends_on:
      - postgres
      - airflow-statsd

  airflow-statsd:
    image: prom/statsd-exporter:latest
    container_name: airflow_statsd_exporter
    ports:
      - "9101:9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - producer
      - kafka_consumer_for_postgres
      - kafka_consumer_for_azure
      - airflow
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://kafka_user:${POSTGRES_PASSWORD}@postgres:5432/kafka_data?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - '8085:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data: