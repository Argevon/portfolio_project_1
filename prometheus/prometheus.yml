global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'kafka_producer'
    static_configs:
      - targets: ['producer:8000']

  - job_name: 'kafka_consumer_for_postgres'
    static_configs:
      - targets: ['kafka_consumer_for_postgres:8001']

  - job_name: 'kafka_consumer_for_azure'
    static_configs:
      - targets: ['kafka_consumer_for_azure:8002']

  - job_name: 'airflow'
    static_configs:
      - targets: [ 'airflow_statsd_exporter:9100' ]

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
